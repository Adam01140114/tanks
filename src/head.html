<title>Tabletop Tanks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a toy diorama on a wooden table filling the screen; mission ribbons slide across the middle; a slim HUD sits in the top corners. One warm daylight look. */
:root{
  --table:#5b3a22; --ink:#2b2118; --paper:#fff8ec; --ribbon:#c8382f; --ribbon2:#2f5fb8; --gold:#f2b632; --shade:rgba(43,33,24,.55);
  --f-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif; --f-u:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--table);color:var(--ink);font-family:var(--f-u)}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%}
#app.aiming #gl{cursor:none}
#hudc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shadowtext{text-shadow:0 2px 0 rgba(43,33,24,.55)}
button{font-family:var(--f-d)}
.btn{appearance:none;border:0;background:var(--paper);color:var(--ink);font:600 20px/1 var(--f-d);padding:13px 22px 12px;border-radius:14px;box-shadow:0 5px 0 rgba(43,33,24,.45);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(43,33,24,.45)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.red{background:var(--ribbon);color:var(--paper)} .btn.blue{background:var(--ribbon2);color:var(--paper)}
.btn.big{font-size:30px;padding:16px 34px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.hl{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;color:var(--paper);font:600 22px var(--f-d)}
.lives{display:flex;gap:6px;align-items:center;font:600 20px var(--f-d)}
.tico{width:26px;height:18px;border-radius:5px 5px 3px 3px;position:relative;display:inline-block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.tico::after{content:"";position:absolute;left:8px;top:-6px;width:10px;height:8px;border-radius:5px 5px 2px 2px;background:inherit;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.hr{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50vw}
.pausebtn{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:auto;font-size:15px;padding:8px 12px 7px}
#mineBtn{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));pointer-events:auto;display:none;width:76px;height:76px;border-radius:50%}
body.touch #mineBtn{display:inline-flex}
.stick{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,248,236,.18);border:2px solid rgba(255,248,236,.5);pointer-events:auto;display:none;touch-action:none}
body.touch .stick{display:block}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,248,236,.85)}

/* Ribbons */
#banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);pointer-events:none}
.ribbon{background:var(--ribbon);color:var(--paper);padding:18px 16px 16px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(43,33,24,.35);animation:rib .45s cubic-bezier(.2,1.4,.4,1)}
.ribbon.blue{background:var(--ribbon2)} .ribbon.gold{background:var(--gold);color:var(--ink)}
.ribbon h2{margin:0;font:700 clamp(40px,8vw,76px)/1 var(--f-d);letter-spacing:.01em}
.ribbon p{margin:8px 0 0;font:600 clamp(18px,3vw,26px)/1.2 var(--f-d)}
.ribbon .lv{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font:600 22px var(--f-d)}
@keyframes rib{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Panels */
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:rgba(43,33,24,.45)}
.card{background:var(--paper);border-radius:22px;box-shadow:0 10px 0 rgba(43,33,24,.4);padding:22px;width:min(560px,100%);display:grid;gap:14px}
.card h2{margin:0;font:700 38px/1 var(--f-d);text-wrap:balance}
.card p{margin:0;font:600 15px/1.5 var(--f-u)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tally{display:grid;gap:6px}
.tally div{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;font:600 18px var(--f-d);border-bottom:2px dashed rgba(43,33,24,.15);padding-bottom:5px}
.tally b{font-variant-numeric:tabular-nums}
.medal{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;font:700 14px var(--f-d);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
#title{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;padding-block:20px;background:linear-gradient(180deg,rgba(43,33,24,.15),rgba(43,33,24,.55));overflow-y:auto}
.tcard{display:grid;gap:18px;justify-items:center;text-align:center;max-width:620px}
.logo{margin:0;font:700 clamp(60px,12vw,120px)/.85 var(--f-d);color:var(--paper);text-shadow:0 6px 0 var(--ribbon),0 10px 0 rgba(43,33,24,.5)}
.logo span{display:block;font-size:.45em;color:var(--gold);text-shadow:0 4px 0 rgba(43,33,24,.5)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;background:rgba(255,248,236,.92);border-radius:16px;padding:14px 18px;font:700 13px var(--f-u);text-align:left;width:100%;box-sizing:border-box}
.keys div{display:flex;justify-content:space-between;gap:10px}
.keys kbd{font:700 12px var(--f-u);background:#efe2c8;border-radius:6px;padding:1px 6px}
.medals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:50vh;overflow-y:auto}
.mgrid button{appearance:none;border:0;border-radius:10px;background:#efe2c8;font:600 16px var(--f-d);padding:10px 0;cursor:pointer}
.mgrid button:hover{background:var(--gold)}
/* Co-op lobby */
.lobcard{width:min(860px,100%)}
.lobgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.qrbox{background:var(--paper);border:3px solid #efe2c8;border-radius:16px;padding:10px;display:grid;place-items:center}
#qr img,#qr canvas{display:block;width:100%!important;height:auto!important;max-width:300px}
.lobside{display:grid;gap:12px;min-width:0}
.seats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.seats li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:#f6ecd8;border-radius:12px;padding:10px 12px;font:600 17px var(--f-d)}
.seats li span:first-child{display:flex;gap:10px;align-items:center}
.seats .ok{color:#2f7a3a;font:700 14px var(--f-u)} .seats .wait{color:#8a6a4a;font:700 14px var(--f-u)}
.linkrow{display:flex;gap:8px;align-items:center;min-width:0}
.linkrow code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:#f6ecd8;border-radius:10px;padding:10px;font:600 12px ui-monospace,Consolas,monospace;user-select:text;-webkit-user-select:text}
.linkrow .btn{font-size:15px;padding:10px 14px 9px}
.rules{background:#f6ecd8;border-radius:12px;padding:10px 12px}
.note{color:#7a5a3c;font:600 13px/1.4 var(--f-u)!important}
.toast{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font:600 16px var(--f-d);padding:10px 16px;border-radius:12px;box-shadow:0 5px 0 rgba(43,33,24,.4);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
@media (max-width:640px){.lobgrid{grid-template-columns:1fr}.qrbox{max-width:300px;justify-self:center;width:100%;box-sizing:border-box}}

/* Phone controller */
#pad{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr;gap:8px;background:radial-gradient(ellipse at 50% 30%,#6b4428,#3e2614);color:var(--paper);padding:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;--me:var(--paper);font-family:var(--f-u)}
#pad.p1{--me:#6f9cf0} #pad.p2{--me:#f07a6c}
.padtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.padeyebrow{font:700 11px var(--f-u);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.padname{display:flex;gap:10px;align-items:center;font:700 26px var(--f-d);color:var(--me)}
.padinfo{font:600 16px var(--f-d);opacity:.85}
.padstatus{margin:0;font:600 14px/1.35 var(--f-u);opacity:.85;min-height:1.35em}
.padmain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;min-height:0}
.padzone{display:grid;gap:8px;justify-items:center;min-width:0}
.padlbl{font:700 12px var(--f-u);opacity:.7;text-align:center}
.padstick{width:min(42vmin,220px);aspect-ratio:1;max-width:100%;border-radius:50%;background:rgba(255,248,236,.08);border:3px solid rgba(255,248,236,.3);position:relative;touch-action:none}
.padstick.aim{border-color:var(--me)}
.padstick.on{background:rgba(255,248,236,.16)}
.padknob{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;border-radius:50%;background:var(--paper);transform:translate(-50%,-50%);box-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none}
.padstick.aim .padknob{background:var(--me)}
.padmine{width:min(22vmin,96px);aspect-ratio:1;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font:700 18px var(--f-d);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none}
.padmine.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
@media (orientation:portrait){.padmain{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}.padmid{grid-column:1/-1;grid-row:1;justify-self:center}}
@media (max-width:560px){.keys{grid-template-columns:1fr}.hl{font-size:18px}}
@media (prefers-reduced-motion:reduce){.ribbon{animation:none}}
</style>

<div id="app">
  <div id="gl"></div>
  <canvas id="hudc"></canvas>
  <div id="hud" hidden>
    <div class="hl shadowtext"><span id="hMission">Mission 1</span><span class="lives" id="hLivesBox"><i class="tico" style="background:#3b6fd8"></i>×<span id="hLives">3</span></span><span class="lives" id="hScore" hidden><i class="tico" style="background:#3b6fd8"></i><span id="hS1">0</span><span style="opacity:.6">–</span><span id="hS2">0</span><i class="tico" style="background:#d8473a"></i></span></div>
    <div class="hr" id="hEnemies"></div>
    <button class="btn pausebtn" id="bPause" aria-label="Pause">Pause</button>
    <button class="btn red" id="mineBtn">Mine</button>
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  </div>
  <div id="banner" hidden></div>

  <div id="title">
    <div class="tcard">
      <h1 class="logo">Tabletop<span>Tanks</span></h1>
      <div class="row" style="justify-content:center">
        <button class="btn red big" id="tStart">Start</button>
        <button class="btn blue" id="tCoop">Co-op</button>
        <button class="btn blue" id="tVersus">Versus</button>
        <button class="btn" id="tSelect">Mission select</button>
        <button class="btn" id="tSound">Sound on</button>
      </div>
      <div class="medals" id="tMedals"></div>
      <div class="shadowtext" style="color:var(--paper);font:600 16px var(--f-d)" id="tBest"></div>
      <div class="keys">
        <div><span>Move</span><kbd>W A S D</kbd></div>
        <div><span>Aim</span><kbd>Mouse</kbd></div>
        <div><span>Fire</span><kbd>Left click</kbd></div>
        <div><span>Lay a mine</span><kbd>Right click / Space</kbd></div>
        <div><span>Pause</span><kbd>P / Esc</kbd></div>
        <div><span>Touch</span><kbd>Stick + tap to fire</kbd></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="results" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 id="rTitle">Results</h2><span id="rMedal"></span></div>
      <p id="rSub"></p>
      <div class="tally" id="rTally"></div>
      <div class="row" style="justify-content:space-between;font:700 22px var(--f-d)"><span>Total</span><span id="rTotal">0</span></div>
      <div class="row"><button class="btn red" id="rAgain">Play again</button><button class="btn" id="rMenu">Title</button></div>
    </div>
  </div>

  <div class="overlay" id="select" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Mission select</h2><button class="btn" id="sClose">Close</button></div>
      <p>Practice any mission you have reached. Practice runs don't count toward medals.</p>
      <div class="mgrid" id="sGrid"></div>
    </div>
  </div>

  <div class="overlay" id="lobby" hidden>
    <div class="card lobcard">
      <div class="row" style="justify-content:space-between"><h2 id="lTitle">Couch co-op</h2><button class="btn" id="lBack">Back</button></div>
      <p id="lRules" class="rules"></p>
      <p id="lSub">Opening a room…</p>
      <div class="lobgrid" id="lRoom" hidden>
        <div class="qrbox"><div id="qr"></div></div>
        <div class="lobside">
          <ul class="seats" id="lSeats"></ul>
          <div class="linkrow"><code id="lLink"></code><button class="btn" id="lCopy">Copy link</button></div>
          <button class="btn red big" id="lStart" disabled>Start</button>
          <p class="note" id="lNote"></p>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <div class="overlay" id="paused" hidden>
    <div class="card" style="width:min(380px,100%)">
      <h2>Paused</h2>
      <div class="row"><button class="btn red" id="pResume">Resume</button><button class="btn" id="pQuit">Quit to title</button></div>
    </div>
  </div>
</div>
